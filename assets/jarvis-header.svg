<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">kmadlenge-collab developer profile header</title>
  <desc id="desc">A dark futuristic heads-up display with cyan interface lines and the text KMADLENGE, digital systems, developer and creative technologist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02070d"/>
      <stop offset="0.55" stop-color="#07111b"/>
      <stop offset="1" stop-color="#03070c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#00e5ff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0d3341" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="26" fill="url(#glow)"/>

  <g opacity="0.8" stroke="#00d9ff" fill="none">
    <path d="M40 64H190L220 34H410" stroke-width="2"/>
    <path d="M790 34H980L1010 64H1160" stroke-width="2"/>
    <path d="M40 296H190L220 326H410" stroke-width="2"/>
    <path d="M790 326H980L1010 296H1160" stroke-width="2"/>
    <circle cx="600" cy="180" r="122" stroke-width="1.5" opacity="0.4"/>
    <circle cx="600" cy="180" r="144" stroke-width="1" stroke-dasharray="2 12" opacity="0.55"/>
    <path d="M600 18V62M600 298V342M438 180H482M718 180H762" opacity="0.5"/>
  </g>

  <g filter="url(#softGlow)" fill="#58efff">
    <circle cx="70" cy="64" r="4"/>
    <circle cx="1130" cy="64" r="4"/>
    <circle cx="70" cy="296" r="4"/>
    <circle cx="1130" cy="296" r="4"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="118" font-size="14" letter-spacing="7" fill="#6adff0">KM // DIGITAL SYSTEMS</text>
    <text x="600" y="188" font-size="54" font-weight="700" letter-spacing="9" fill="#eafcff">KMADLENGE</text>
    <text x="600" y="226" font-size="17" letter-spacing="4" fill="#7feeff">DEVELOPER · CREATIVE TECHNOLOGIST · PRODUCT BUILDER</text>
    <text x="600" y="267" font-size="12" letter-spacing="5" fill="#4398aa">SYSTEM ONLINE // BUILD · DESIGN · AUTOMATE · SHIP</text>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#38bcd1" opacity="0.75">
    <text x="54" y="104">CORE::NEXT/REACT</text>
    <text x="54" y="124">API::LARAVEL/NODE</text>
    <text x="54" y="144">MODE::PRODUCT</text>
    <text x="966" y="104">QA::AUTOMATED</text>
    <text x="966" y="124">DEPLOY::CLOUD</text>
    <text x="966" y="144">AI::ASSISTED</text>
  </g>
</svg>
